name: Deploy to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./GroceryInventorySystem/GroceryInventorySystem.csproj

      - name: Build
        run: dotnet build ./GroceryInventorySystem/GroceryInventorySystem.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./GroceryInventorySystem/GroceryInventorySystem.csproj --configuration Release --output ./publish

      - name: Deploy to MonsterASP
        shell: powershell
        run: |
          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:contentPath="$env:GITHUB_WORKSPACE\publish" `
            -dest:auto,computerName="https://${{ secrets.SERVER_COMPUTER_NAME }}:8172/msdeploy.axd?site=${{ secrets.WEBSITE_NAME }}",userName="${{ secrets.SERVER_USERNAME }}",password="${{ secrets.SERVER_PASSWORD }}",authType="Basic" `
            -enableRule:AppOffline `
            -allowUntrusted
